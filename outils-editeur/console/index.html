<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Console éditeur — Algonis</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0f22'/><path d='M9 22 16 9l7 13' stroke='%23d9ab3f' stroke-width='2.5' fill='none' stroke-linejoin='round'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="marque">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#121936"/><path d="M9 22 16 9l7 13" stroke="#d9ab3f" stroke-width="2.5" fill="none" stroke-linejoin="round"/></svg>
    <div>
      <strong>Console éditeur</strong>
      <span>Licences Algonis</span>
    </div>
  </div>
  <div class="etat-cles" id="etatCles"></div>
</header>

<main class="page">

  <section class="kpis" id="kpis" aria-label="Chiffres clés"></section>

  <section class="bloc">
    <div class="barre">
      <div class="recherche">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m13.5 13.5 3.5 3.5"/></svg>
        <label class="sr" for="q">Rechercher une société</label>
        <input id="q" type="search" placeholder="Rechercher une société, un identifiant d'installation…" autocomplete="off">
      </div>
      <div class="filtres" id="filtres" role="group" aria-label="Filtrer par statut">
        <button type="button" class="puce actif" data-filtre="tous">Toutes</button>
        <button type="button" class="puce" data-filtre="active">Actives</button>
        <button type="button" class="puce" data-filtre="bientot">Bientôt</button>
        <button type="button" class="puce" data-filtre="expiree">Expirées</button>
        <button type="button" class="puce" data-filtre="aucune">Sans licence</button>
      </div>
      <button type="button" class="btn primaire" id="btnNouvelle">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
        Nouvelle société
      </button>
    </div>

    <div id="liste" class="liste" aria-live="polite"></div>
  </section>

</main>

<div class="modale" id="modale" hidden>
  <div class="voile" data-fermer></div>
  <div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="modaleTitre">
    <div class="fenetre-tete">
      <h2 id="modaleTitre"></h2>
      <button type="button" class="btn fantome icone" data-fermer aria-label="Fermer">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
      </button>
    </div>
    <div class="fenetre-corps" id="modaleCorps"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/app.js"></script>
</body>
</html>
