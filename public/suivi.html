<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="/">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>

      </div>

    <div class="hero compact">
      <h1 style="font-size:clamp(1.5rem,3vw,2.1rem)">Suivre une demande</h1>

        <input type="text" id="ref-input" placeholder="Ex. BKG-260720-AB12" autocomplete="off" spellcheck="false" />

        </button>
      </form>
      <div id="track-result" class="track-result"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <span>© Portail Comptes — création automatisée de comptes sur les applications métiers.</span>
      <span class="links">
        <a href="/">Applications</a>
        <a href="/admin.html">Administration</a>

    </div>
  </footer>

  <script src="/js/common.js"></script>
