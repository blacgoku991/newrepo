<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Vos identifiants — %SOCIETE%</title>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23101731'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%23E9C05C' font-family='Arial' font-weight='bold'>A</text></svg>" />
  <style>
    .cred-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .cred-card { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 36px 32px; text-align: center; }
    .cred-logo { height: 32px; width: auto; background: #fff; padding: 6px 11px; border-radius: 9px; box-sizing: content-box; margin: 0 auto 20px; display: inline-block; }
    .cred-logo-txt { display: inline-block; font-weight: 700; font-size: 1.2rem; color: #fff; margin-bottom: 18px; }
    .cred-card .cmark { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(160deg, var(--gold-bright), var(--gold-dark)); color: var(--gold-ink); display: grid; place-items: center; margin: 0 auto 18px; }
    .cred-card .cmark svg { width: 26px; height: 26px; }
    .cred-card h1 { font-size: 1.35rem; color: #fff; }
    .cred-card .sub { color: var(--muted); font-size: .92rem; margin: 8px 0 24px; }
    .cred-row { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
    .cred-row .k { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 96px; flex: none; }
    .cred-row .v { flex: 1; font-family: var(--mono); font-size: 1.02rem; color: var(--gold-bright); font-weight: 700; letter-spacing: .03em; overflow-wrap: anywhere; }
    .cred-row button { background: var(--gold-soft); border: 1px solid var(--gold-line); color: var(--gold-bright); border-radius: 7px; padding: 5px 11px; font: inherit; font-size: .74rem; font-weight: 650; cursor: pointer; flex: none; }
    .cred-row button:hover { background: rgba(217,171,63,.22); }
    .cred-warning { margin-top: 18px; font-size: .84rem; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: var(--radius-sm); padding: 11px 14px; text-align: left; }
    .cred-note { margin-top: 16px; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <nav data-fil-retour="/suivi.html" data-fil-libelle="Retour au suivi" class="flottant"></nav>
  <div class="cred-wrap">
    <div class="cred-card" id="card">
      <img class="cred-logo" src="/img/societe" alt="" data-marque="logo"
           data-fallback="Portail comptes" data-fallback-cls="cred-logo-txt" />
      <div class="cmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h1>Vos identifiants de connexion</h1>
      <p class="sub" id="sub">Ils ne peuvent être affichés qu'<strong>une seule fois</strong>. Assurez-vous d'être prêt à les enregistrer dans un endroit sûr.</p>
      <div id="zone">
        <button class="btn btn-primary btn-block" id="reveal-btn">Afficher mes identifiants</button>
      </div>
      <p class="cred-note">Besoin d'aide ? Rapprochez-vous de votre administrateur.</p>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/identifiants.js"></script>
</body>
</html>
