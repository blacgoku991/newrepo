<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mentions légales — %SOCIETE%</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23101731'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%23E9C05C' font-family='Arial' font-weight='bold'>A</text></svg>" />
  <style>
    .legal-wrap { max-width: 820px; margin: 0 auto; padding: 48px 24px 64px; }
    .legal-wrap h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); color: #fff; }
    .legal-wrap .lede { color: var(--muted); margin-top: 10px; font-size: 1rem; }
    .legal-wrap section { margin-top: 34px; scroll-margin-top: 90px; }
    .legal-wrap h2 { font-size: 1.24rem; color: #fff; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .legal-wrap h3 { font-size: 1rem; color: var(--gold-bright); margin: 18px 0 6px; }
    .legal-wrap p, .legal-wrap li { color: var(--text); font-size: .95rem; line-height: 1.7; }
    .legal-wrap ul { margin: 8px 0 8px 20px; }
    .legal-wrap dl { display: grid; grid-template-columns: 200px 1fr; gap: 8px 16px; margin-top: 10px; }
    .legal-wrap dt { color: var(--muted); font-size: .9rem; }
    .legal-wrap dd { color: var(--text); font-size: .92rem; }
    .legal-wrap .todo { color: var(--faint); font-style: italic; }
    .legal-wrap a { color: var(--gold-bright); }
    .legal-wrap table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .9rem; }
    .legal-wrap th { text-align: left; color: var(--muted); font-weight: 600; font-size: .78rem;
      text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .legal-wrap td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--text); }
    .legal-wrap .tbl { overflow-x: auto; }
    @media (max-width: 560px) {
      .legal-wrap dl { grid-template-columns: 1fr; gap: 2px 0; }
      .legal-wrap dt { margin-top: 8px; }
      .legal-wrap table { min-width: 460px; }
    }
  </style>
</head>
<body class="public">
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="/">
        <img class="brand-logo" src="/img/societe" alt="" data-marque="logo" data-fallback="Portail comptes" data-fallback-cls="brand-fallback" />
        <span class="brand-sub">Accès applications</span>
      </a>
      <nav class="topnav">
        <a href="/" data-nav="apps">Applications</a>
        <a href="/demarches.html" data-nav="demarches">Démarches</a>
        <a href="/espace" class="nav-espace" data-nav="espace" hidden>Mon espace</a>
        <a href="/suivi.html" data-nav="suivi">Suivre une demande</a>
        <a href="/admin.html" class="admin-link" data-nav="admin">Administration</a>
      </nav>
    </div>
  </header>

  <main>
    <nav data-fil-retour="/" data-fil-libelle="Retour"></nav>
    <div class="legal-wrap" id="legal"><p class="loading">Chargement…</p></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="/js/common.js"></script>
  <script src="/js/mentions.js"></script>
</body>
</html>
