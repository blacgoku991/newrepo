<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mon espace — Algonis</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23101731'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%23E9C05C' font-family='Arial' font-weight='bold'>A</text></svg>" />
  <style>
    .esp-wrap { max-width: 1080px; margin: 0 auto; padding: 44px 24px 72px; }
    .esp-head { margin-bottom: 26px; }
    .esp-head h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); color: #fff; }
    .esp-head p { color: var(--muted); margin-top: 8px; }
    .etab-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .etab-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px;
                 background: var(--gold-soft); color: var(--gold-bright); border: 1px solid var(--gold-line); font-size: .84rem; font-weight: 600; }
    .etab-chip svg { width: 15px; height: 15px; }
    .esp-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .esp-act { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid transparent; border-radius: var(--radius-lg); padding: 18px 20px; color: inherit; transition: border-color .16s, background .16s, transform .16s; }
    .esp-act:hover { border-left-color: var(--gold); border-color: var(--line-2); background: var(--surface-3); transform: translateX(2px); text-decoration: none; }
    .esp-act .ic { width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-bright); border: 1px solid var(--gold-line); }
    .esp-act .ic svg { width: 21px; height: 21px; }
    .esp-act b { display: block; color: #fff; font-size: 1rem; }
    .esp-act > span:last-child > span { color: var(--muted); font-size: .84rem; }
    @media (max-width: 820px) { .esp-actions { grid-template-columns: 1fr; } }
    .esp-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 34px 0 14px; }
    .esp-section-head h2 { font-size: 1.18rem; color: #fff; }
    .esp-section-head .hint { color: var(--faint); font-size: .84rem; }
    .acc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .acc-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .acc-card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .acc-card .who { font-weight: 650; color: #fff; font-size: 1.02rem; }
    .acc-card .acc-login { font-family: var(--mono); font-size: .9rem; color: var(--gold-bright); margin-top: 3px; }
    .acc-card .meta { color: var(--muted); font-size: .85rem; line-height: 1.6; }
    .acc-card .meta b { color: var(--text); font-weight: 600; }
    .acc-card .meta div { display: flex; align-items: center; gap: 7px; }
    .acc-card .meta svg { width: 15px; height: 15px; flex: none; color: var(--gold-bright); }
    .acc-card .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
    .acc-card .actions .btn { flex: 1; min-width: 140px; justify-content: center; gap: 7px; }
    .acc-card .actions .btn svg { width: 15px; height: 15px; flex: none; }
    .acc-card .acc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .acc-card .acc-src { font-size: .68rem; }
    .esp-search { display: block; margin: 4px 0 16px; }
    .esp-search input { width: 100%; padding: 11px 14px; font-size: .92rem; color: var(--text); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius); }
    .esp-search input:focus { outline: none; border-color: var(--gold-bright); box-shadow: 0 0 0 3px var(--gold-soft); }
    .esp-search input::placeholder { color: var(--faint); }
    /* Sélecteur d'application : le choix doit être évident au premier regard.
       L'option retenue se distingue par le logo en couleur, le cadre doré et
       une coche — jamais par la seule couleur. */
    .app-switch-hint { font-size: .82rem; color: var(--muted); margin: 2px 0 8px; }
    .app-switch { display: inline-flex; gap: 6px; padding: 6px; margin-bottom: 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; flex-wrap: wrap; }
    .app-opt { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 18px 8px 10px; border-radius: 11px; border: 1px solid transparent; background: transparent; color: var(--muted); font-family: inherit; font-size: .93rem; font-weight: 650; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .app-opt:hover { color: var(--text); background: var(--surface-3); }
    .app-opt:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
    .app-opt .lg { width: 34px; height: 34px; flex: none; border-radius: 8px; background: #fff; display: grid; place-items: center; padding: 4px; }
    .app-opt .lg img, .app-opt .lg .logo { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
    .app-opt .lg svg { width: 18px; height: 18px; color: var(--surface-2); }
    .app-opt .lg .logo-fallback { width: 100%; height: 100%; border-radius: 5px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .8rem; }
    /* Option non retenue : logo éteint, pour que l'active ressorte. */
    .app-opt:not(.on) .lg { filter: grayscale(1); opacity: .5; }
    .app-opt.on { background: var(--gold-soft); border-color: var(--gold-line); color: var(--gold-bright); }
    .app-opt.on .ck { width: 15px; height: 15px; flex: none; }
    @media (max-width: 600px) { .app-switch { display: flex; width: 100%; } .app-opt { flex: 1; justify-content: center; } }
    .acc-src { font-size: .68rem; }
    .acc-table td { vertical-align: middle; }
    .acc-table .ref { font-size: .86rem; }
    .acc-row-actions { display: flex; gap: 6px; white-space: nowrap; justify-content: flex-end; }
    .acc-row-actions .btn { gap: 5px; padding: 6px 11px; }
    .acc-row-actions .btn svg { width: 14px; height: 14px; }
    @media (max-width: 760px) { .acc-row-actions .btn span { display: none; } }
    /* Pagination. */
    .esp-pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .esp-pager .pg-info { color: var(--muted); font-size: .82rem; }
    .pg-btns { display: flex; gap: 5px; align-items: center; }
    .pg { min-width: 34px; height: 34px; padding: 0 9px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); color: var(--muted); font-size: .85rem; font-weight: 600; cursor: pointer; }
    .pg:hover:not(:disabled) { color: var(--text); border-color: var(--gold-line); }
    .pg.on { background: var(--gold-soft); color: var(--gold-bright); border-color: var(--gold-line); }
    .pg:disabled { opacity: .4; cursor: default; }
    .pg-ell { color: var(--faint); padding: 0 2px; }
    .empty-box { background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--radius-lg); padding: 40px 24px; text-align: center; color: var(--muted); }
    .notauth { max-width: 620px; margin: 60px auto; text-align: center; }
    .notauth .ic { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 18px; background: var(--gold-soft); color: var(--gold-bright); border: 1px solid var(--gold-line); }
    .notauth .ic svg { width: 30px; height: 30px; }
    .notauth h1 { color: #fff; font-size: 1.5rem; }
    .notauth p { color: var(--muted); margin-top: 12px; }
  </style>
</head>
<body class="public">
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="/">
        <img class="brand-logo" src="/img/algonis" alt="Algonis" data-fallback="Algonis" data-fallback-cls="brand-fallback" />
        <span class="brand-sub">Accès applications</span>
      </a>
      <nav class="topnav">
        <a href="/" data-nav="apps">Applications</a>
        <a href="/demarches.html" data-nav="demarches">Démarches</a>
        <a href="/espace" class="active" data-nav="espace">Mon espace</a>
        <a href="/suivi.html" data-nav="suivi">Suivre une demande</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="esp-wrap" id="esp">
      <div class="loading">Chargement de votre espace…</div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="/js/common.js"></script>
  <script src="/js/espace.js"></script>
</body>
</html>
