<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Administration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f5fda'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>P</text></svg>" />
</head>
<body class="auth">
  <form class="login" id="login-form" novalidate>
    <div class="lmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1>Espace administration</h1>
    <p class="sub">Connectez-vous pour accéder au tableau de bord.</p>
    <div class="alert alert-err" id="err" style="display:none;margin-bottom:15px"></div>
    <div class="field">
      <label for="username">Identifiant</label>
      <input type="text" id="username" autocomplete="username" required autofocus />
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="login-btn" style="margin-top:8px">Se connecter</button>
    <p class="foot">Portail Comptes — accès réservé au personnel autorisé.</p>
  </form>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
