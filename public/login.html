<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Administration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23101731'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%23E9C05C' font-family='Arial' font-weight='bold'>A</text></svg>" />
</head>
<body class="auth center">
  <form class="login" id="login-form" novalidate>
    <img class="login-logo" src="/img/algonis" alt="Algonis" data-fallback="Algonis" data-fallback-cls="login-logo-txt" />
    <h1>Espace administration</h1>
    <p class="sub">Connectez-vous pour accéder au tableau de bord.</p>
    <div class="alert alert-err" id="err" style="display:none;margin-bottom:15px"></div>
    <div class="field">
      <label for="username">Identifiant</label>
      <input type="text" id="username" autocomplete="username" required autofocus />
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="login-btn" style="margin-top:8px">Se connecter</button>
    <p class="foot">Algonis — accès réservé au personnel autorisé.</p>
  </form>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
