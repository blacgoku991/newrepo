<body class="centre">
  <form class="carte connexion" id="form">
    <div class="marque">Smartfixx</div>
    <h1>Panel des licences</h1>
    <p class="sous">Administration du parc clients.</p>
    <div class="alerte err" id="err" hidden></div>
    <label>Identifiant<input type="text" id="u" autocomplete="username" autofocus required /></label>
    <label>Mot de passe<input type="password" id="p" autocomplete="current-password" required /></label>
    <button type="submit" class="btn primaire large" id="btn">Se connecter</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
