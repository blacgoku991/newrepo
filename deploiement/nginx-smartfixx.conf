# Smartfixx — un seul bloc pour le panel ET tous les portails clients.
# Ajouter une société ne demande AUCUNE modification ici : c'est l'application
# qui aiguille d'après le nom d'hôte.

server {
    # Ubuntu 24.04 livre nginx 1.24 : la directive « http2 on; » n'y existe pas
    # encore, HTTP/2 s'active sur la ligne « listen ».
    listen 443 ssl http2;
    server_name saas.__DOMAINE__ *.__DOMAINE__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAINE__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAINE__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Les logos envoyés depuis le panel montent jusqu'à 512 ko, soit environ
    # 700 ko une fois encodés en base64 dans le corps JSON.
    client_max_body_size 2m;

    # Les robots peuvent mettre plusieurs minutes sur une création : sans cela,
    # nginx couperait la connexion avant la fin et l'écran de suivi resterait
    # bloqué alors que le travail se poursuit.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # C'EST CET EN-TÊTE que Smartfixx lit pour connaître le visiteur, et lui
        # seul. `proxy_set_header` REMPLACE ce que le visiteur aurait pu écrire ;
        # `X-Forwarded-For` ci-dessous, lui, AJOUTE à sa suite — sa première
        # valeur est donc celle de l'attaquant, et s'y fier reviendrait à le
        # laisser changer d'adresse à chaque requête pour échapper à toute
        # limitation de débit. Ne remplacez pas cette ligne.
        proxy_set_header X-Real-IP         $remote_addr;
        # Conservé pour les outils d'analyse de journaux ; le portail l'ignore.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Indispensable : sans cet en-tête, les portails se croient servis en
        # clair et n'apposent ni le drapeau Secure sur les cookies, ni HSTS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name saas.__DOMAINE__ *.__DOMAINE__;
    # Le renouvellement du certificat passe par le DNS : rien à servir en clair.
    return 301 https://$host$request_uri;
}
